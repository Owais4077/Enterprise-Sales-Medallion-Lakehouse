[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-data-platform"
version = "0.1.0"
description = "Enterprise Sales & Customer Data Platform - medallion lakehouse portfolio project"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", ".", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"data_generation/**" = ["S311"]   # seeded, non-cryptographic randomness is the point
"tests/**" = ["S101", "S105", "S106"]   # asserts and fake test passwords are fine in tests

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp -m \"not integration\""
markers = [
    "integration: needs external services (Postgres, Spark, API); run with -m integration",
]
